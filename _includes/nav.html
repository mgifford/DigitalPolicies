<nav class="site-nav" aria-label="Main navigation">
  <div class="site-nav__inner">
    <a href="{{ site.baseurl }}/" class="site-nav__brand" aria-label="Open Digital Policies — home">
      ODP
      <span>Open Digital Policies</span>
    </a>

    <ul class="site-nav__links" id="site-nav-links" role="list">
      <li><a href="{{ site.baseurl }}/domains/" {% if page.url contains '/domains/' %}aria-current="page"{% endif %}>Explore Policies</a></li>
      <li><a href="{{ site.baseurl }}/about/" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a></li>
      <li><a href="{{ site.baseurl }}/adoptions/" {% if page.url == '/adoptions/' %}aria-current="page"{% endif %}>Adoptions</a></li>
      <li><a href="{{ site.baseurl }}/tools/" {% if page.url contains '/tools/' %}aria-current="page"{% endif %}>Tools</a></li>
      <li><a href="https://github.com/{{ site.github_repo }}" rel="noopener" aria-label="GitHub repository (opens in new window)">GitHub<span aria-hidden="true"> ↗</span></a></li>
    </ul>

    <div class="site-nav__controls">
      <a href="{{ site.baseurl }}/search/" class="search-toggle" aria-label="Search"
         {% if page.url contains '/search/' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false" width="20" height="20">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>

      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" type="button">
      <!-- Sun icon (shown in dark mode — click to go light) -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon icon (shown in light mode — click to go dark) -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      </button>

      <button class="nav-toggle" id="nav-toggle" type="button"
              aria-expanded="false" aria-controls="site-nav-links"
              aria-label="Open navigation menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
  (function() {
    var toggle = document.getElementById('nav-toggle');
    var links  = document.getElementById('site-nav-links');
    if (!toggle || !links) return;

    toggle.addEventListener('click', function() {
      var isOpen = links.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    });

    // Close on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && links.classList.contains('is-open')) {
        links.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation menu');
        toggle.focus();
      }
    });
  }());
  </script>
</nav>
