title: Open Digital Policies
tagline: Model policy language for the digital age
description: >
  Open Digital Policies provides openly licensed, community-maintained model
  policy language that advocates, communities, and governments can adopt,
  adapt, and improve.

url: "https://mgifford.github.io"
baseurl: "/DigitalPolicies"

author:
  name: Open Digital Policies community
  url: https://github.com/mgifford/DigitalPolicies

# Social / SEO
# twitter.username removed intentionally — we do not link to X/Twitter
# The twitter:card type is kept via a manual tag in default.html because it is
# re-used by other platforms (e.g. social card format hinting).

# Default social image — referenced by jekyll-seo-tag for og:image
logo: /DigitalPolicies/assets/img/og-image.png

# GitHub repository (used for edit links)
github_repo: mgifford/DigitalPolicies
github_branch: main

# Jekyll settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Process the _policies/ directory as a Jekyll collection
collections:
  policies:
    output: true
    permalink: /domains/:path/

# Apply the domain-full layout to all policy files without requiring front matter
defaults:
  - scope:
      type: policies
    values:
      layout: domain-full
      render_with_liquid: false
      # og:image inherits site.logo; individual pages can override with image: front matter
      image: /DigitalPolicies/assets/img/og-image.png

# Files/directories to exclude from Jekyll processing
exclude:
  - README.md
  - CONTRIBUTING.md
  - FRAMEWORK.md
  - GLOSSARY.md
  - EU-LAWS-ANALYSIS.md
  - INTERNATIONAL-EXAMPLES.md
  - TAXONOMY.md
  - POLICY_TEMPLATE.md
  - Gemfile
  - Gemfile.lock
  - "*.sh"
  - node_modules/
  - .github/
  - _site/
  - adoptions/tracker.md
  - translations/

# Sass settings
sass:
  style: compressed
