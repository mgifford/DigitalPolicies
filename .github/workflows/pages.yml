name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check internal links (htmlproofer)
        # Checks the compiled _site output for broken internal links.
        # External links are skipped here (--disable-external) to keep CI fast
        # and avoid false positives from rate-limiting; lychee.yml handles those.
        # --swap-urls strips the GitHub Pages baseurl prefix (e.g. /DigitalPolicies)
        # so htmlproofer can resolve absolute paths against the _site/ directory.
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-status-codes "0,999" \
            --ignore-files "/_site\/feed\.xml/" \
            --swap-urls "^${{ steps.pages.outputs.base_path }}:" \
            2>&1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on push to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
