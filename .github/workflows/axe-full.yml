name: Accessibility full matrix (Playwright + axe-core)

# Runs on every push to main but only executes every 5 commits.
# Covers light/dark × desktop/mobile across all site pages.
# Can also be triggered manually for ad-hoc audits.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: "Check if axe run is needed"
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || $(( $GITHUB_RUN_NUMBER % 5 )) -eq 0 ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  axe-matrix:
    name: "axe — ${{ matrix.label }}"
    runs-on: ubuntu-latest
    needs: gate
    # Run every 5 commits to avoid noise; always run on manual dispatch.
    if: needs.gate.outputs.should_run == 'true'

    strategy:
      # Never cancel siblings — we want the full picture across all configurations.
      fail-fast: false
      matrix:
        include:
          - label: "light-desktop"
            theme: light
            project: desktop
            artifact: axe-light-desktop

          - label: "dark-desktop"
            theme: dark
            project: desktop
            artifact: axe-dark-desktop

          - label: "light-mobile"
            theme: light
            project: mobile
            artifact: axe-light-mobile

          - label: "dark-mobile"
            theme: dark
            project: mobile
            artifact: axe-dark-mobile

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.229.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          npm install -g serve
          serve _site --listen 4001 &
          # Wait for server to be ready
          npx wait-on http://localhost:4001 --timeout 30000

      - name: Run axe (${{ matrix.label }})
        env:
          A11Y_THEME: ${{ matrix.theme }}
          BASE_URL: http://localhost:4001
        run: |
          mkdir -p playwright-results
          npx playwright test --project=${{ matrix.project }} --reporter=list,json

      - name: Upload results (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            playwright-results/
            test-results/
          retention-days: 30
