name: Accessibility full matrix (axe-core)

# Runs on every push to main, but only executes the jobs every 5 commits.
# Light/dark × mobile/desktop across all site pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  axe-matrix:
    name: "axe — ${{ matrix.label }}"
    runs-on: ubuntu-latest
    # Only run every 5 commits (or on manual dispatch)
    if: github.event_name == 'workflow_dispatch' || github.run_number % 5 == 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "light-desktop"
            chrome_options: "--window-size=1440,900"
            artifact_name: "axe-light-desktop"

          - label: "dark-desktop"
            chrome_options: "--force-dark-mode --window-size=1440,900"
            artifact_name: "axe-dark-desktop"

          - label: "light-mobile"
            chrome_options: "--window-size=375,812"
            artifact_name: "axe-light-mobile"

          - label: "dark-mobile"
            chrome_options: "--force-dark-mode --window-size=375,812"
            artifact_name: "axe-dark-mobile"

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.229.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install axe-cli and serve
        run: npm install -g @axe-core/cli serve

      - name: Install matching Chrome and ChromeDriver
        run: npx browser-driver-manager install chrome

      - name: Serve site and run axe (${{ matrix.label }})
        run: |
          serve _site --listen 4001 &
          SERVER_PID=$!
          sleep 3

          mkdir -p axe-results

          PAGES=(
            "/"
            "/domains/"
            "/domains/data-centers/full-model/"
            "/domains/accessibility/full-model/"
            "/domains/ai-adoption/full-model/"
            "/domains/algorithmic-accountability/full-model/"
            "/domains/open-source-in-government/full-model/"
            "/domains/web-sustainability/full-model/"
            "/domains/digital-sovereignty/full-model/"
            "/domains/smart-cities/full-model/"
            "/domains/children-technology/full-model/"
            "/domains/freedom-of-expression/full-model/"
            "/domains/digital-public-infrastructure/full-model/"
            "/about/"
            "/adoptions/"
            "/search/"
            "/tools/"
            "/tools/advocate/"
            "/tools/policy-pro/"
          )

          FAILED=0
          for PAGE in "${PAGES[@]}"; do
            SLUG=$(echo "$PAGE" | sed 's|/|_|g' | sed 's|^_||' | sed 's|_$||')
            SLUG="${SLUG:-home}"
            echo "::group::Testing http://localhost:4001${PAGE} [${{ matrix.label }}]"
            axe "http://localhost:4001${PAGE}" \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa \
              --chrome-options="${{ matrix.chrome_options }}" \
              --exit \
              --save "axe-results/${SLUG}.json" || FAILED=1
            echo "::endgroup::"
          done

          kill $SERVER_PID
          exit $FAILED

      - name: Upload axe results (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: axe-results/
          retention-days: 30
