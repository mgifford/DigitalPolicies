name: External link check (lychee)

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  push:
    branches: [main]
    paths:
      - '_policies/**/*.md'
      - '**/*.html'
      - '_data/**'
  workflow_dispatch:

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --output ./lychee/out.md
            --format markdown
            --exit-code-1-if-exits
            _policies/
            about/index.html
            domains/index.html
            adoptions/index.html
            search/index.html
            tools/
            index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue for broken links
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Broken external links detected'
          content-filepath: ./lychee/out.md
          labels: |
            broken-link
            automated
