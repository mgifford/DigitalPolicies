name: Accessibility (Playwright + axe-core)

# PR gate: runs on every pull request against main.
# Desktop, light mode — fast baseline check before merge.
# The full light/dark × mobile/desktop matrix runs every 5 commits via axe-full.yml.
on:
  pull_request:
    branches: [main]

jobs:
  axe:
    name: axe-core accessibility check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.229.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          npm install -g serve
          serve _site --listen 4001 &
          npx wait-on http://localhost:4001 --timeout 30000

      - name: Run axe (desktop, light)
        env:
          A11Y_THEME: light
          BASE_URL: http://localhost:4001
        run: |
          mkdir -p playwright-results
          npx playwright test --project=desktop --reporter=list,json

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results-pr
          path: |
            playwright-results/
            test-results/
          retention-days: 14
