# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Maximum number of concurrent requests
max_concurrency = 8

# Timeout for each request (seconds)
timeout = 20

# Number of retries for failed requests
retry_wait_time = 5
max_retries = 3

# Accept these HTTP status codes as valid (in addition to 2xx)
accept = [200, 201, 202, 203, 204, 206, 429]

# User agent — identify ourselves politely
user_agent = "lychee/2 (Open Digital Policies link checker; https://github.com/mgifford/DigitalPolicies)"

# Skip URLs matching these patterns
# - Localhost / test URLs
# - GitHub edit links with Liquid template variables (Jekyll not rendered in source)
# - Fragment-only links
# - Known rate-limiters or login-required pages
exclude = [
  "^http://localhost",
  "^http://127\\.0\\.0\\.1",
  "[{][{] site",
  "[{][{] page",
  "site\\.baseurl",
  "site\\.github_repo",
  "site\\.github_branch",
  "^#",
  # LinkedIn rate-limits aggressively
  "linkedin\\.com",
  # Twitter/X requires login for many pages
  "twitter\\.com",
  "x\\.com",
  # Sites that return 403 for automated checkers but serve content to browsers
  "doi\\.colorado\\.gov",
  "ftc\\.gov",
  "e3p\\.jrc\\.ec\\.europa\\.eu",
  "amsterdam\\.nl",
  "legifrance\\.gouv\\.fr",
  "undp\\.org",
  "substack\\.com",
  "claude\\.ai",
  # Council of Europe document server returns 401 to bots but is publicly accessible
  "rm\\.coe\\.int",
  # Sites with HTTP/2 protocol issues in CI
  "esafety\\.gov\\.au",
  # Sites with intermittent connection failures in CI
  "digital-services-act\\.ec\\.europa\\.eu",
  # Sites that consistently time out from CI runners
  "gesetze-im-internet\\.de",
  "gdpr\\.eu",
  # NYC government sites block automated link checkers (403)
  "nyc\\.gov",
  # Wayback Machine exact-timestamp snapshot URLs are fragile:
  # a specific timestamp may have no crawl, returning 404.
  # These URLs serve as historical references and are excluded from automated checking.
  "web\\.archive\\.org",
]

# Skip these file patterns
exclude_path = [
  ".git",
  "_site",
  "node_modules",
  "vendor",
  "Gemfile.lock",
]

# Include these schemes
scheme = ["https", "http"]
