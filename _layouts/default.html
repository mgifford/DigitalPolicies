<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Canonical -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

  <!-- Sitemap discovery -->
  <link rel="sitemap" type="application/xml" href="{{ site.baseurl }}/sitemap.xml">

  <!-- Meta keywords — supplementary signal for secondary search engines and AI crawlers -->
  <meta name="keywords" content="digital policy, model policy language, open government, digital rights, data center policy, AI governance, digital accessibility, right to repair, open source government, algorithmic accountability, web sustainability, digital sovereignty, community advocacy">

  <!-- Authorship and licence -->
  <meta name="author" content="Open Digital Policies community">
  <meta name="license" content="https://creativecommons.org/licenses/by/4.0/">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

  <!-- Theme: restore saved preference before paint to prevent flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('odp-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    }());
  </script>

  <!-- Feed -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">

  <!-- Core social / SEO tags (Open Graph, Twitter Card) generated by jekyll-seo-tag.
       These power LinkedIn, Bluesky, Mastodon, and other platforms that read OG metadata. -->
  {% seo %}

  <!-- Supplemental Open Graph tags not output by jekyll-seo-tag -->
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{% if page.description %}{{ page.description | strip_newlines | strip | truncate: 200 | escape }}{% else %}{{ site.description | strip_newlines | strip | truncate: 200 | escape }}{% endif %}">
  <meta property="og:locale" content="en_US">

  <!-- Social card format hint — used by multiple platforms beyond X/Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Schema.org structured data — WebSite + Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "{{ site.url }}{{ site.baseurl }}/#website",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "name": "{{ site.title }}",
        "description": {{ site.description | strip_newlines | strip | jsonify }},
        "publisher": { "@id": "{{ site.url }}{{ site.baseurl }}/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "{{ site.url }}{{ site.baseurl }}/search/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "{{ site.url }}{{ site.baseurl }}/#organization",
        "name": "Open Digital Policies",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ site.url }}{{ site.baseurl }}/assets/img/og-image.png",
          "width": 1200,
          "height": 630
        },
        "sameAs": [
          "https://github.com/mgifford/DigitalPolicies"
        ]
      }{% if page.layout == "domain-full" or page.layout == "default" %},
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "{{ site.url }}{{ site.baseurl }}/"
          }{% if page.url != "/" and page.url != "" %},{
            "@type": "ListItem",
            "position": 2,
            "name": {{ page.title | default: site.title | jsonify }},
            "item": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
          }{% endif %}
        ]
      }{% endif %}
    ]
  }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  {% include nav.html %}

  <main id="main-content" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;

      function getTheme() {
        var saved = localStorage.getItem('odp-theme');
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('odp-theme', theme);
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }

      // Set correct aria-label on load
      applyTheme(getTheme());

      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    }());
  </script>
</body>
</html>
